# Continuous integration: runs lint + full test suite on every push and PR.
# Release-tag validation and desktop packaging stay in ci.yml and desktop.yml.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --loglevel=error
        env:
          # onnxruntime-node@1.22.0's postinstall downloads extra platform binaries
          # from NuGet, which misses the win-x64 CUDA .so on ubuntu CI runners and
          # fails. CI only validates logic and doesn't load the desktop-native ORT
          # runtime, so skip that download.
          ONNXRUNTIME_NODE_INSTALL: 'skip'
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run lint
      - run: npm test
      - run: npm run verify:agent-skill
      - run: npm run build
