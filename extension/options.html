<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lazynext — Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 520px; margin: 40px auto; padding: 0 24px 80px; }
    .field { margin: 16px 0; }
    .field label { display: block; font-weight: 600; margin-bottom: 6px; }
    .field input { width: 100%; padding: 9px 11px; background: var(--panel); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 13px; }
    .field .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
    .row { display: flex; gap: 12px; }
    .row .field { flex: 1; }
    h1 { font-size: 20px; }
    #save { margin-top: 8px; }
    #saved { color: var(--ok); margin-left: 12px; opacity: 0; transition: opacity .3s; }
    #saved.show { opacity: 1; }
    pre { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
      overflow: auto; color: var(--muted); font-size: 12px; max-height: 200px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="" class="logo">
    <h1>Lazynext Settings</h1>
  </header>

  <section>
    <div class="field">
      <label for="url">Server URL</label>
      <input id="url" type="url" placeholder="http://localhost:5199">
      <div class="hint">The Lazynext editor URL. Local default is <code>http://localhost:5199</code>.</div>
    </div>
    <div class="field">
      <label for="key">API Key</label>
      <input id="key" type="password" placeholder="LAZYNEXT_API_KEY">
      <div class="hint">The gateway API key (<code>LAZYNEXT_API_KEY</code> in the server's <code>.env</code>). Required for the extension to read/write projects and upload media.</div>
    </div>
    <div>
      <button id="save" class="btn">Save</button>
      <button id="test" class="btn btn-ghost">Test connection</button>
      <span id="saved">Saved</span>
    </div>
    <div id="test-result" class="status-line" style="margin-top:12px"></div>
  </section>

  <section>
    <h2>Agent tools</h2>
    <pre id="tools">Loading…</pre>
  </section>

  <script type="module" src="options.js"></script>
</body>
</html>
